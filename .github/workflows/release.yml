name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish CabSpan Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Single-File Release & Run Self-Tests
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $cleanVersion = $tag.TrimStart('v', 'V')
          $distDir = "dist"

          # 1. Update Version in CabSpan.csproj
          $csproj = Get-Content "CabSpan.csproj" -Raw
          $csproj = $csproj -replace '<Version>.*?</Version>', "<Version>$cleanVersion</Version>"
          $csproj = $csproj -replace '<AssemblyVersion>.*?</AssemblyVersion>', "<AssemblyVersion>$cleanVersion.0</AssemblyVersion>"
          $csproj = $csproj -replace '<FileVersion>.*?</FileVersion>', "<FileVersion>$cleanVersion.0</FileVersion>"
          Set-Content -Path "CabSpan.csproj" -Value $csproj -Encoding UTF8

          # 2. Publish single-file portable executable to dist/
          dotnet publish CabSpan.csproj -c Release -r win-x64 --self-contained false `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -o $distDir

          # 3. Clean PDBs and package release zip
          $exePath = Join-Path $distDir "CabSpan.exe"
          Get-ChildItem -Path $distDir -Filter "*.pdb" -ErrorAction SilentlyContinue | Remove-Item -Force
          $readmeTxtPath = Join-Path $distDir "README.txt"
          Copy-Item -Path "README.md" -Destination $readmeTxtPath -Force
          $zipPath = Join-Path $distDir "CabSpan-$tag.zip"
          Compress-Archive -Path $exePath, $readmeTxtPath -DestinationPath $zipPath -Force

          # 4. Verify math self-tests
          .\dist\CabSpan.exe --test-math
          if ($LASTEXITCODE -ne 0) { throw "Math self-test failed!" }

          # 5. Output SHA256 checksum to environment
          $exeHash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          "EXE_SHA256=$exeHash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CabSpan ${{ github.ref_name }} (Experimental Preview)"
          files: |
            dist/CabSpan.exe
            dist/CabSpan-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ### 🧪 CabSpan ${{ github.ref_name }} — Experimental Community Preview
            Multi-monitor FOV calculator, `.sii` generator, and 1-click Single-Screen / Multi-Monitor switcher for **American Truck Simulator** & **Euro Truck Simulator 2**.

            - **Quick Start:** Download **`CabSpan-${{ github.ref_name }}.zip`** (or **`CabSpan.exe`** directly), place it in a folder on your PC, and run **`CabSpan.exe`**.
            - **Safe Auto-Backup:** Your original single-monitor `config.cfg` is automatically backed up to `config.single_monitor.bak` before any changes are made, and can be restored anytime with 1 click via **↺ Undo / Restore Default**.

            ---
            **SHA-256 Checksum (`CabSpan.exe`):**
            `SHA256: ${{ env.EXE_SHA256 }}`
